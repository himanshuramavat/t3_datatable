name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  COMPOSER_ALLOW_SUPERUSER: "1"
  TYPO3_SKIP_ASSET_PUBLISH: "1"

jobs:
  tests:
    name: Tests (TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    container:
      image: himanshuramavat/php-ci:${{ matrix.php }}-v1.4.0
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        typo3: ['^13.4', '^14.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          php -v
          composer --version

      - name: Pin TYPO3 version
        run: |
          rm -rf .Build/vendor .Build/bin composer.lock
          composer require --no-update --no-interaction --no-progress \
            "typo3/cms-core:${{ matrix.typo3 }}" \
            "typo3/cms-backend:${{ matrix.typo3 }}" \
            "typo3/cms-fluid:${{ matrix.typo3 }}"
          composer require --no-update --no-interaction --no-progress --dev \
            "typo3/cms-beuser:${{ matrix.typo3 }}" \
            "typo3/cms-install:${{ matrix.typo3 }}"

      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: php -d memory_limit=512M .Build/bin/phpunit -c Build/phpunit/UnitTests.xml

      - name: Run functional tests
        run: php -d memory_limit=512M .Build/bin/phpunit -c Build/phpunit/FunctionalTests.xml

  stan:
    name: PHPStan
    runs-on: ubuntu-latest
    container:
      image: himanshuramavat/php-ci:8.2-v1.4.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pin TYPO3 version
        run: |
          rm -rf .Build/vendor .Build/bin composer.lock
          composer require --no-update --no-interaction --no-progress --dev \
            "typo3/cms-core:^13.4" \
            "typo3/cms-backend:^13.4" \
            "typo3/cms-fluid:^13.4" \
            "typo3/cms-beuser:^13.4" \
            "typo3/cms-install:^13.4"
          composer update --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan

  cs:
    name: Coding Standards
    runs-on: ubuntu-latest
    container:
      image: himanshuramavat/php-ci:8.2-v1.4.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP-CS-Fixer
        run: composer cs:check

  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    container:
      image: himanshuramavat/php-ci:8.2-v1.4.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse check
        run: find Classes Configuration Tests -name "*.php" -print0 | xargs -0 -n1 -P8 php -l
