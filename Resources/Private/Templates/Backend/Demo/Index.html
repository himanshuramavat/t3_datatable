<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <div class="t3-datatable-module">

        <div class="t3-datatable-module__card">
            <div class="t3-datatable-module__card-header">
                <div class="t3-datatable-module__card-leading">
                    <div class="t3-datatable-module__card-icon" aria-hidden="true">
                        <core:icon identifier="actions-view-table-expand" size="medium" />
                    </div>
                    <div class="t3-datatable-module__card-text">
                        <div class="t3-datatable-module__card-title-row">
                            <h1 class="t3-datatable-module__card-title">
                                <f:translate key="LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.card.title" />
                            </h1>
                            <ul class="t3-datatable-module__chips" aria-label="{f:translate(key: 'LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.chips.label')}">
                                <li class="t3-datatable-module__chip">
                                    <span class="t3-datatable-module__chip-label">
                                        <f:translate key="LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.meta.grid" />
                                    </span>
                                    <code>{gridIdentifier}</code>
                                </li>
                                <li class="t3-datatable-module__chip">
                                    <span class="t3-datatable-module__chip-label">
                                        <f:translate key="LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.meta.table" />
                                    </span>
                                    <code>{tableName}</code>
                                </li>
                            </ul>
                        </div>
                        <p class="t3-datatable-module__card-subtitle">
                            <f:translate key="LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.card.subtitle" />
                        </p>
                    </div>
                </div>
                <button type="button"
                        class="btn btn-default btn-sm t3-datatable-module__refresh"
                        id="t3-datatable-refresh-btn"
                        title="{f:translate(key: 'LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.refresh')}">
                    <core:icon identifier="actions-refresh" size="small" />
                    <span class="t3-datatable-module__refresh-label">
                        <f:translate key="LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.refresh" />
                    </span>
                </button>
            </div>

            <f:render partial="Module/DataTablePanel" arguments="{
                tableId: 't3-datatable-demo',
                gridIdentifier: gridIdentifier,
                columns: columns,
                columnsJson: columnsJson,
                pageLength: pageLength
            }" />
        </div>

        <footer class="t3-datatable-module__footer">
            <span>
                <f:translate key="LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.footer.made_with" />
                <a href="https://www.linkedin.com/in/himanshu-ramavat/" target="_blank" rel="noopener">Himanshu</a>
            </span>
            <div class="t3-datatable-module__footer-links">
                <a href="https://packagist.org/users/himanshuramavat/" target="_blank" rel="noopener">
                    <core:icon identifier="actions-link" size="small" />
                    <f:translate key="LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.footer.packagist" />
                </a>
                <span class="t3-datatable-module__footer-sep">|</span>
                <a href="https://datatables.net/manual/server-side" target="_blank" rel="noopener">
                    <core:icon identifier="actions-notebook-typoscript" size="small" />
                    <f:translate key="LLL:EXT:t3_datatable/Resources/Private/Language/locallang_mod_demo.xlf:module.demo.footer.protocol" />
                </a>
            </div>
        </footer>

    </div>
</f:section>

</html>
